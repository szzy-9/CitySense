services:
  - type: web
    name: citysense
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_LIVE_CITY_DATA
        value: "true"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "8"
      - key: PREDICTION_MEDIUM_MIN_SAMPLES
        value: "12"
      - key: PREDICTION_HIGH_MIN_SAMPLES
        value: "30"
      - key: PREDICTION_MEDIUM_MAX_CV
        value: "1.0"
      - key: PREDICTION_HIGH_MAX_CV
        value: "0.5"
      - key: PREDICTION_MIN_ALERT_CONFIDENCE
        value: MEDIUM
