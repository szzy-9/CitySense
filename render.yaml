services:
  - type: web
    name: citysense
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_LIVE_CITY_DATA
        value: "true"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "8"
